<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>RejHub — dostęp administratora</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --ink: #f2f5ff;
        --muted: #a3abc9;
        --stroke: rgba(255, 255, 255, 0.16);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background: #06070f;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .aurora {
        position: fixed;
        inset: -30%;
        background:
          radial-gradient(36% 40% at 25% 30%, rgba(92, 116, 255, 0.5), transparent 70%),
          radial-gradient(32% 36% at 76% 26%, rgba(0, 208, 186, 0.34), transparent 72%),
          radial-gradient(44% 44% at 60% 84%, rgba(176, 92, 255, 0.38), transparent 74%);
        filter: blur(26px) saturate(135%);
        animation: drift 24s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from { transform: translate3d(-2%, -1%, 0) scale(1); }
        to { transform: translate3d(2%, 2%, 0) scale(1.07); }
      }
      .card {
        position: relative;
        width: min(420px, 100%);
        padding: 34px 30px;
        border-radius: 26px;
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.045));
        border: 1px solid var(--stroke);
        box-shadow:
          0 40px 90px -34px rgba(0, 0, 0, 0.9),
          inset 0 1px 0 rgba(255, 255, 255, 0.32);
        backdrop-filter: blur(26px) saturate(165%);
        -webkit-backdrop-filter: blur(26px) saturate(165%);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #8ea2ff, #5ce1d0);
        color: #080b16;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 0;
      }
      h1 {
        margin: 22px 0 8px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }
      p.lead {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      label {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 7px;
      }
      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 13px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(8, 10, 22, 0.55);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        outline: none;
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }
      input:focus {
        border-color: rgba(150, 175, 255, 0.7);
        box-shadow: 0 0 0 4px rgba(120, 145, 255, 0.18);
      }
      .field { margin-bottom: 15px; }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 14px 18px;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        font: inherit;
        font-weight: 650;
        font-size: 15px;
        color: #0a0d18;
        background: linear-gradient(140deg, #eef2ff, #b7c4ff);
        cursor: pointer;
        transition: transform 0.16s ease, opacity 0.16s ease;
      }
      button:hover:not(:disabled) { transform: translateY(-1px); }
      button:disabled { opacity: 0.6; cursor: default; }
      .error {
        display: none;
        margin-top: 16px;
        padding: 11px 13px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.5;
        color: #ffd9df;
        background: rgba(255, 84, 112, 0.14);
        border: 1px solid rgba(255, 110, 135, 0.35);
      }
      .error[data-visible="true"] { display: block; }
      .back {
        display: inline-block;
        margin-top: 20px;
        font-size: 12.5px;
        color: rgba(178, 187, 216, 0.85);
        text-decoration: none;
        border-bottom: 1px dotted rgba(178, 187, 216, 0.4);
      }
      @media (prefers-reduced-motion: reduce) { .aurora { animation: none; } }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <main class="card">
      <div class="brand"><span class="brand-mark">R</span> RejHub</div>
      <h1>Dostęp administratora</h1>
      <p class="lead">To konto z uprawnieniami administratora RejHub. Zwykli goście widzą stronę „w budowie”.</p>

      <form id="login-form" autocomplete="on" novalidate>
        <div class="field">
          <label for="email">E-mail administratora</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Hasło</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button id="submit" type="submit">Zaloguj się</button>
      </form>

      <div class="error" id="error" role="alert" aria-live="polite"></div>
      <a class="back" href="/w-budowie">← Wróć do strony w budowie</a>
    </main>

    <script>
      (function () {
        var form = document.getElementById("login-form");
        var errorBox = document.getElementById("error");
        var submit = document.getElementById("submit");

        function showError(message) {
          errorBox.textContent = message;
          errorBox.setAttribute("data-visible", "true");
        }

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          errorBox.removeAttribute("data-visible");
          submit.disabled = true;
          submit.textContent = "Sprawdzam…";

          try {
            var response = await fetch("/api/session", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
              })
            });
            if (response.ok) {
              window.location.replace("/");
              return;
            }
            if (response.status === 403) {
              showError("To konto nie ma uprawnień administratora RejHub.");
            } else if (response.status === 401) {
              showError("Nieprawidłowy e-mail lub hasło.");
            } else if (response.status === 503) {
              showError("Logowanie nie jest jeszcze skonfigurowane na serwerze.");
            } else {
              showError("Nie udało się zalogować (" + response.status + "). Spróbuj ponownie.");
            }
          } catch (error) {
            showError("Brak połączenia z serwerem. Spróbuj ponownie.");
          }

          submit.disabled = false;
          submit.textContent = "Zaloguj się";
        });
      })();
    </script>
  </body>
</html>
