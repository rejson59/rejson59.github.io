<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rejson Widgets — Minimalistyczny Liquid Glass</title>
  <meta name="description" content="Minimalistyczny widżet Liquid Glass dla wszystkich stron Rejson59.">
  <link rel="canonical" href="https://rejson59.github.io/rejson-widgets/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0b0e14">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="/css/liquid.css?v=2026-10-30-2">
  <link rel="stylesheet" href="/css/rejchat.css?v=1">
  <script defer src="/js/rejchat-profiles.js?v=1"></script>
  <link rel="stylesheet" href="/css/responsive.css?v=1">
  <link rel="stylesheet" href="/css/mobile-ads.css?v=4">
  <script defer src="/js/mobile-ads.js?v=4"></script>
  <link rel="stylesheet" href="/css/side-ads.css?v=4">
  <script defer src="/js/side-ads.js?v=4"></script>
</head>
<body class="rj-studio">

  <div class="studio-backdrop" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./">
        <img class="brand-mark" src="favicon.svg" alt="" width="26" height="26">
        <span>rejson-widgets</span>
      </a>

      <nav class="header-nav">
        <a class="btn btn-glass btn-sm nav-icon-link" href="../admin" title="Panel admina" aria-label="Panel admina"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#admin"></use></svg><span class="nav-label">Panel</span></a>
        <button id="theme-toggle" class="theme-btn" type="button" aria-label="Przełącz motyw">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="minimal-hero">
    <h1><svg class="page-mark" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#widget"></use></svg>Jeden widżet dla każdej Twojej strony.</h1>
    <p class="minimal-lead">
      Minimalistyczna kapsułka Liquid Glass, która po kliknięciu płynnie rozrasta się w formularz błędów i pomysłów.
    </p>

    <div class="glass-card embed-bar">
      <code class="embed-code mono" id="embed-snippet"></code>
      <button class="btn btn-primary btn-sm" id="btn-copy" type="button">Kopiuj</button>
    </div>

    <section class="glass-card mini-studio" aria-label="Konfigurator na żywo">
      <div class="mini-row">
        <span class="mini-label">Tło podglądu</span>
        <div class="pill-group">
          <button type="button" class="pill-opt is-active" data-opt-group="backdrop" data-opt-val="dark">Ciemne</button>
          <button type="button" class="pill-opt" data-opt-group="backdrop" data-opt-val="light">Jasne</button>
          <button type="button" class="pill-opt" data-opt-group="backdrop" data-opt-val="vivid">Kolorowe</button>
        </div>
      </div>

      <div class="mini-row">
        <span class="mini-label">Kształt przycisku</span>
        <div class="pill-group">
          <button type="button" class="pill-opt is-active" data-opt-group="mode" data-opt-val="pill">Kapsułka</button>
          <button type="button" class="pill-opt" data-opt-group="mode" data-opt-val="orb">Kropka</button>
          <button type="button" class="pill-opt" data-opt-group="mode" data-opt-val="edge">Krawędź</button>
        </div>
      </div>

      <div class="mini-row">
        <span class="mini-label">Pozycja</span>
        <div class="pill-group">
          <button type="button" class="pill-opt is-active" data-opt-group="position" data-opt-val="bottom-right">Prawy dół</button>
          <button type="button" class="pill-opt" data-opt-group="position" data-opt-val="bottom-left">Lewy dół</button>
          <button type="button" class="pill-opt" data-opt-group="position" data-opt-val="top-right">Prawa góra</button>
          <button type="button" class="pill-opt" data-opt-group="position" data-opt-val="top-left">Lewa góra</button>
        </div>
      </div>

      <div class="mini-actions">
        <span style="font-size:12px;color:var(--faint)">Możesz też przeciągnąć kapsułkę myszką albo wcisnąć <span class="mono">Alt + R</span></span>
        <button class="btn btn-primary btn-sm" id="btn-test-morph" type="button" data-rj-keep="1">Rozwiń / Zwiń widżet</button>
      </div>
    </section>
  </main>

  <script>window.REJSON_WIDGET_ALLOW_IFRAME = true;</script>
  <script src="js/supabase-config.js"></script>
  <script src="/js/media-capture.js?v=2"></script>
  <script src="widget.js?v=11"></script>
  <script src="js/studio.js"></script>
  <noscript><div class="rj-mobile-ads-spacer" aria-hidden="true"></div><aside id="rj-mobile-ads" aria-label="Mini reklamy i promocje"><span class="rj-mobile-ads-label">mini reklamy i promocje :)</span><div class="rj-mobile-ads-items"><a class="rj-mobile-ad rj-mobile-ad--house" href="/rejfile"><span class="rj-mobile-ad-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v13H6z"/><path d="M14 3v5h4M12 16V10m-2 2 2-2 2 2"/></svg></span><span>RejFile · wyślij plik</span></a><a class="rj-mobile-ad rj-mobile-ad--offer" href="/partnerstwo#propozycja"><span class="rj-mobile-ad-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 11-5v14L4 14zM4 10v4m3.5 1 1.5 4h3l-1-3.3M18 9l2-2m-2 5h3m-3 3 2 2"/></svg></span><span>Twoja reklama tutaj</span></a></div></aside></noscript>
</body>
</html>
