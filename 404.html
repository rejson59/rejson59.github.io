<!DOCTYPE html>

  <title>Nie znaleziono strony — rejson59.github.io</title>
  <script>
    // Starsze linki do portali prowadzą teraz do automatycznej podróży.
    var portalMatch = location.pathname.match(/^\/portal\/([A-Za-z0-9._-]{1,100})\/?$/);
    if (portalMatch && portalMatch[1] !== "." && portalMatch[1] !== "..") {
      location.replace("/podroz/?projekt=" + encodeURIComponent(portalMatch[1]) + "&v=3");
    }
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
